<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot × Outlook 可用性打卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2307080a'/><circle cx='50' cy='50' r='26' fill='none' stroke='white' stroke-width='8'/></svg>">
<style>
  /* ===== Dark (default, Raycast) ===== */
  :root {
    --bg: #07080a;
    --surface-1: #0d0d0d;
    --surface-2: #101111;
    --surface-3: #121212;
    --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.16);
    --fg: #f5f5f5;
    --fg-secondary: #a3a3a8;
    --fg-muted: #6e6e73;
    --cta-bg: #ffffff;
    --cta-fg: #07080a;
    --green: #30d158;
    --green-dim: rgba(48,209,88,0.14);
    --red: #ff453a;
    --red-dim: rgba(255,69,58,0.14);
    --orange: #ff9f0a;
    --orange-dim: rgba(255,159,10,0.14);
    --blue: #0a84ff;
    --glow: rgba(255,255,255,0.055);
    --shadow-modal: 0 24px 80px rgba(0,0,0,0.6);
    --radius-card: 14px;
    --radius-sm: 10px;
  }
  /* ===== Light ===== */
  [data-theme="light"] {
    --bg: #f7f7f8;
    --surface-1: #ffffff;
    --surface-2: #f5f5f6;
    --surface-3: #ebebed;
    --border: rgba(0,0,0,0.09);
    --border-strong: rgba(0,0,0,0.18);
    --fg: #1a1a1e;
    --fg-secondary: #55555e;
    --fg-muted: #8e8e96;
    --cta-bg: #111114;
    --cta-fg: #ffffff;
    --green: #1d9e46;
    --green-dim: rgba(52,199,89,0.13);
    --red: #e0342b;
    --red-dim: rgba(255,69,58,0.10);
    --orange: #c77700;
    --orange-dim: rgba(255,159,10,0.13);
    --blue: #0071e3;
    --glow: rgba(0,0,0,0.045);
    --shadow-modal: 0 24px 80px rgba(0,0,0,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: var(--cta-bg); color: var(--cta-fg); }
  html { color-scheme: dark; }
  [data-theme="light"] { color-scheme: light; }
  body {
    font-family: 'Inter', -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
    font-feature-settings: "calt", "kern", "liga", "ss03";
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(ellipse 80% 40% at 50% -10%, var(--glow), transparent);
    background-repeat: no-repeat;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .container { max-width: 880px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ===== Auth screen ===== */
  .auth-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .auth-card {
    width: 100%; max-width: 380px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 18px; padding: 32px 28px;
    box-shadow: var(--shadow-modal);
  }
  .auth-logo {
    width: 44px; height: 44px; border-radius: 12px; margin-bottom: 18px;
    background: var(--cta-bg); color: var(--cta-fg);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px;
  }
  .auth-card h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
  .auth-card .sub { color: var(--fg-muted); font-size: 13px; margin-bottom: 22px; }
  .auth-tabs {
    display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px; margin-bottom: 20px;
  }
  .auth-tab {
    flex: 1; padding: 8px; border: none; border-radius: 999px; background: transparent;
    color: var(--fg-muted); font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: all 0.15s ease; font-family: inherit; font-feature-settings: inherit;
  }
  .auth-tab.active { background: var(--cta-bg); color: var(--cta-fg); }
  .auth-field { margin-bottom: 14px; }
  .auth-field label {
    display: block; font-size: 11.5px; font-weight: 600; margin-bottom: 7px;
    color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .auth-field input {
    width: 100%; padding: 11px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--fg);
    font-size: 14px; font-family: inherit; font-feature-settings: inherit; outline: none;
    transition: border-color 0.15s ease;
  }
  .auth-field input:focus { border-color: var(--border-strong); }
  .auth-error {
    display: none; font-size: 12.5px; color: var(--red);
    background: var(--red-dim); border: 1px solid rgba(255,69,58,0.3);
    border-radius: 999px; padding: 7px 13px; margin-bottom: 14px;
  }
  .auth-error.show { display: block; }
  .auth-submit {
    width: 100%; padding: 11px; border: none; border-radius: 999px;
    background: var(--cta-bg); color: var(--cta-fg);
    font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px;
    transition: opacity 0.15s ease; font-family: inherit; font-feature-settings: inherit;
  }
  .auth-submit:hover { opacity: 0.88; }
  .auth-foot { text-align: center; color: var(--fg-muted); font-size: 11.5px; margin-top: 20px; }

  /* ===== Top bar ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 40px; gap: 10px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--cta-bg); color: var(--cta-fg);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
  }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--fg-secondary); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease; font-size: 15px;
  }
  .icon-btn:hover { border-color: var(--border-strong); color: var(--fg); }
  .icon-btn svg { width: 16px; height: 16px; }
  .user-pill {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 8px 7px 13px; color: var(--fg-secondary);
  }
  .user-avatar {
    width: 20px; height: 20px; border-radius: 99px;
    background: var(--cta-bg); color: var(--cta-fg);
    display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 800; text-transform: uppercase;
  }
  .logout-btn {
    border: none; background: transparent; color: var(--fg-muted);
    cursor: pointer; font-size: 11.5px; font-weight: 600; padding: 3px 6px;
    border-radius: 6px; font-family: inherit; font-feature-settings: inherit;
  }
  .logout-btn:hover { color: var(--red); }
  .today-pill {
    font-size: 13px; font-weight: 500; color: var(--fg-secondary);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px; white-space: nowrap;
  }

  /* ===== Hero ===== */
  .hero { margin-bottom: 36px; }
  .hero h1 {
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 800; letter-spacing: -0.035em; line-height: 1.08;
    margin-bottom: 12px;
  }
  .hero h1 .dim { color: var(--fg-muted); }
  .hero p { color: var(--fg-secondary); font-size: 15px; line-height: 1.6; max-width: 560px; }

  /* ===== Legend ===== */
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  .legend-item {
    display: flex; align-items: center; gap: 7px; font-size: 12.5px;
    color: var(--fg-secondary); font-weight: 500;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 12px 5px 8px;
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 99px; }
  .legend-dot.green { background: var(--green); box-shadow: 0 0 8px var(--green-dim); }
  .legend-dot.orange { background: var(--orange); box-shadow: 0 0 8px var(--orange-dim); }
  .legend-dot.red { background: var(--red); box-shadow: 0 0 8px var(--red-dim); }

  /* ===== Month section ===== */
  .month-section {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 22px;
    margin-bottom: 18px;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .month-title {
    font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
    margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
  }
  .month-title .badge {
    font-size: 11.5px; padding: 3px 10px; border-radius: 999px;
    background: var(--surface-3); border: 1px solid var(--border);
    color: var(--fg-secondary); font-weight: 500;
  }

  /* ===== Calendar ===== */
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-header {
    text-align: center; font-size: 11px; font-weight: 600;
    color: var(--fg-muted); padding: 6px 0; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .day-cell {
    aspect-ratio: 1; border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s ease; font-size: 13px;
    background: var(--surface-2); min-height: 54px; position: relative;
  }
  .day-cell:hover { border-color: var(--border-strong); background: var(--surface-3); transform: translateY(-1px); }
  .day-cell.empty { border: none; background: transparent; cursor: default; }
  .day-cell.empty:hover { transform: none; }
  .day-cell.today { border: 1.5px solid var(--border-strong); }
  .day-cell.today::after {
    content: ''; position: absolute; top: 6px; right: 6px;
    width: 5px; height: 5px; border-radius: 99px; background: var(--fg);
  }
  .day-num { font-weight: 600; font-variant-numeric: tabular-nums; }
  .day-env { font-size: 9px; margin-top: 3px; font-weight: 600; letter-spacing: 0.04em; }

  .day-cell.full { background: var(--green-dim); border-color: var(--green); }
  .day-cell.full .day-num { color: var(--green); }
  .day-cell.full .day-env { color: var(--green); opacity: 0.75; }
  .day-cell.partial { background: var(--orange-dim); border-color: var(--orange); }
  .day-cell.partial .day-num { color: var(--orange); }
  .day-cell.partial .day-env { color: var(--orange); opacity: 0.75; }
  .day-cell.none { background: var(--red-dim); border-color: var(--red); }
  .day-cell.none .day-num { color: var(--red); }
  .day-cell.none .day-env { color: var(--red); opacity: 0.75; }

  .day-cell.future { opacity: 0.3; cursor: not-allowed; }
  .day-cell.future:hover { transform: none; border-color: var(--border); background: var(--surface-2); }

  /* ===== Stats ===== */
  .stats-section {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: 26px; margin-top: 28px;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .stats-section h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 18px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .stat-card {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 16px 12px; text-align: center;
  }
  .stat-card .num { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat-card .label { font-size: 11.5px; color: var(--fg-muted); margin-top: 5px; font-weight: 500; }

  .env-breakdown { border-top: 1px solid var(--border); padding-top: 18px; }
  .env-breakdown h3 { font-size: 13px; margin-bottom: 12px; color: var(--fg-secondary); font-weight: 600; }
  .env-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .env-row:last-child { border-bottom: none; }
  .env-label { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .env-flag {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
    background: var(--surface-3); border: 1px solid var(--border); color: var(--fg-secondary); letter-spacing: 0.05em;
  }
  .env-bars { display: flex; gap: 10px; align-items: center; }
  .env-mini { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .env-bar-track { width: 90px; height: 5px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
  .env-bar-fill { height: 100%; background: var(--fg); border-radius: 99px; }
  .env-bar-num { font-size: 13px; font-weight: 700; min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; }

  .recent-entries { margin-top: 22px; border-top: 1px solid var(--border); padding-top: 18px; }
  .recent-entries h3 { font-size: 13px; margin-bottom: 12px; color: var(--fg-secondary); font-weight: 600; }
  .entry-row {
    display: flex; align-items: center; gap: 12px; padding: 8px 0;
    font-size: 13.5px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .entry-row:last-child { border-bottom: none; }
  .entry-date { font-weight: 600; min-width: 96px; font-variant-numeric: tabular-nums; }
  .entry-status { display: flex; gap: 6px; }
  .status-tag {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600;
    border: 1px solid transparent;
  }
  .status-tag.ok { background: var(--green-dim); color: var(--green); border-color: var(--green-dim); }
  .status-tag.no { background: var(--red-dim); color: var(--red); border-color: var(--red-dim); }
  .entry-env { margin-left: auto; font-size: 12px; color: var(--fg-secondary); font-weight: 500; }

  /* ===== Modal ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
    z-index: 1000; justify-content: center; align-items: center; padding: 20px;
  }
  [data-theme="light"] .modal-overlay { background: rgba(0,0,0,0.35); }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface-1); border: 1px solid var(--border-strong);
    border-radius: 18px; padding: 28px; width: 100%; max-width: 420px;
    box-shadow: var(--shadow-modal);
    animation: modalIn 0.18s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
  .modal h3 { font-size: 19px; margin-bottom: 4px; font-weight: 700; letter-spacing: -0.01em; }
  .modal .date-display { color: var(--fg-muted); font-size: 13.5px; margin-bottom: 22px; }
  .modal label {
    display: block; font-size: 12px; font-weight: 600; margin-bottom: 9px;
    margin-top: 18px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .modal label:first-of-type { margin-top: 0; }
  .btn-group { display: flex; gap: 8px; margin-bottom: 4px; }
  .btn-toggle {
    flex: 1; padding: 10px 8px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface-2); color: var(--fg-secondary);
    cursor: pointer; font-size: 13.5px; font-weight: 600; transition: all 0.15s ease;
    font-family: inherit; font-feature-settings: inherit;
  }
  .btn-toggle:hover { border-color: var(--border-strong); color: var(--fg); }
  .btn-toggle.selected.yes { background: var(--cta-bg); color: var(--cta-fg); border-color: var(--cta-bg); }
  .btn-toggle.selected.no { background: var(--red-dim); color: var(--red); border-color: var(--red); }
  .btn-toggle.env.selected { background: var(--cta-bg); color: var(--cta-fg); border-color: var(--cta-bg); }
  .env-group { flex-wrap: wrap; }
  .env-group .btn-toggle { min-width: calc(50% - 4px); flex: 1 1 calc(50% - 4px); }

  .modal-actions { display: flex; gap: 10px; margin-top: 26px; }
  .btn {
    padding: 11px 18px; border: none; border-radius: 999px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    font-family: inherit; font-feature-settings: inherit;
  }
  .btn-primary { background: var(--cta-bg); color: var(--cta-fg); }
  .btn-primary:hover { opacity: 0.88; }
  .btn-secondary { background: var(--surface-2); color: var(--fg-secondary); border: 1px solid var(--border); }
  .btn-secondary:hover { color: var(--fg); border-color: var(--border-strong); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-danger:hover { background: var(--red-dim); }

  .footer {
    margin-top: 48px; text-align: center; color: var(--fg-muted); font-size: 12.5px;
  }
  .footer .ver {
    display: inline-block; margin-top: 6px; font-size: 11px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 10px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .day-cell { min-height: 42px; font-size: 11px; }
    .day-env { font-size: 8px; }
    .hero h1 { font-size: 30px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .today-pill { display: none; }
  }
</style>
</head>
<body>

<!-- ===== Auth screen ===== -->
<div class="auth-wrap" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">C</div>
    <h1>Copilot Check-in</h1>
    <div class="sub">Copilot × Outlook 可用性打卡</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">登录</button>
      <button class="auth-tab" id="tabReg" onclick="switchAuth('reg')">注册</button>
    </div>
    <div class="auth-error" id="authError"></div>
    <form id="authForm" onsubmit="return handleAuth(event)">
      <div class="auth-field">
        <label for="authUser">用户名</label>
        <input type="text" id="authUser" autocomplete="username" placeholder="3-20 个字符" maxlength="20" required>
      </div>
      <div class="auth-field">
        <label for="authPass">密码</label>
        <input type="password" id="authPass" autocomplete="current-password" placeholder="至少 4 位" required>
      </div>
      <button type="submit" class="auth-submit" id="authSubmit">登录</button>
    </form>
    <div class="auth-foot">数据云端同步 · 登录后多设备一致</div>
  </div>
</div>

<!-- ===== Main app ===== -->
<div class="container hidden" id="appScreen">
  <div class="topbar">
    <div class="brand"><div class="brand-mark">C</div> Copilot Check-in</div>
    <div class="topbar-right">
      <div class="today-pill" id="todayPill"></div>
      <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="切换白天/黑夜模式" aria-label="切换主题">
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
      <div class="user-pill">
        <span class="user-avatar" id="userAvatar"></span>
        <span id="userName"></span>
        <button class="logout-btn" onclick="logout()">退出</button>
      </div>
    </div>
  </div>

  <div class="hero">
    <h1>Copilot × Outlook<br><span class="dim">可用性打卡</span></h1>
    <p>每日记录 Copilot 在 Outlook App 和网页版的可用情况，追踪不同网络环境下的稳定性。</p>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot green"></div> 两个都可用</div>
    <div class="legend-item"><div class="legend-dot orange"></div> 部分可用</div>
    <div class="legend-item"><div class="legend-dot red"></div> 都不可用</div>
  </div>

  <div id="calendars"></div>

  <div class="stats-section">
    <h2>统计数据</h2>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="env-breakdown" id="envBreakdown"></div>
    <div class="recent-entries" id="recentEntries"></div>
  </div>

  <div class="footer">
    数据云端同步，登录后多设备无缝衔接 · copilot.slashbro.top
    <br><span class="ver" id="versionTag"></span>
  </div>
</div>

<!-- ===== Check-in modal ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">打卡</h3>
    <div class="date-display" id="modalDate"></div>
    <label>Outlook App</label>
    <div class="btn-group" id="appGroup">
      <button class="btn-toggle" data-val="yes">可用</button>
      <button class="btn-toggle" data-val="no">不可用</button>
    </div>
    <label>Outlook 网页版</label>
    <div class="btn-group" id="webGroup">
      <button class="btn-toggle" data-val="yes">可用</button>
      <button class="btn-toggle" data-val="no">不可用</button>
    </div>
    <label>使用环境</label>
    <div class="btn-group env-group" id="envGroup">
      <button class="btn-toggle env" data-val="国内">国内</button>
      <button class="btn-toggle env" data-val="美国">美国</button>
      <button class="btn-toggle env" data-val="墨西哥">墨西哥</button>
      <button class="btn-toggle env" data-val="欧洲">欧洲</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="btnDelete" style="display:none;">删除</button>
      <button class="btn btn-secondary" id="btnCancel">取消</button>
      <button class="btn btn-primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<script>
/* ===== Config & constants ===== */
var APP_VERSION = '1.2.1';
var LEGACY_KEY = 'copilot_outlook_checkin';          // v1.0 anonymous data
var LEGACY_BACKUP_KEY = 'copilot_outlook_checkin_backup_v1';
var LOCAL_USERS_KEY = 'copilot_users';               // v1.1.0 local accounts (migration source only)
var SESSION_KEY = 'copilot_session';                 // {user, token, ts}
var THEME_KEY = 'copilot_theme';
var API_BASE = '/api';
function dataKey(user) { return 'copilot_checkin_data_' + user; }

var ENV_CODES = { '国内': 'CN', '美国': 'US', '墨西哥': 'MX', '欧洲': 'EU' };
var WEEKDAYS = ['日','一','二','三','四','五','六'];
var MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

/* ===== State ===== */
var currentUser = null;   // {id, name, token}
var records = {};
var currentDate = new Date();
var modalState = { dateKey: '', app: null, web: null, env: null };
var authMode = 'login';

/* ===== Helpers ===== */
function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(y, m, d) { return y + '-' + pad(m+1) + '-' + pad(d); }
function formatDateCN(y, m, d) { return y + '年' + (m+1) + '月' + d + '日'; }
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

function authFetch(path, opts) {
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if (currentUser && currentUser.token) headers['Authorization'] = 'Bearer ' + currentUser.token;
  opts.headers = headers;
  return fetch(API_BASE + path, opts);
}

async function sha256Hex(text) {
  if (window.crypto && crypto.subtle) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
  }
  var h = 5381;
  for (var i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) >>> 0;
  return 'fb' + h.toString(16);
}

/* ===== Theme ===== */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('iconMoon').style.display = theme === 'dark' ? 'block' : 'none';
  document.getElementById('iconSun').style.display = theme === 'light' ? 'block' : 'none';
}
function toggleTheme() {
  var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  lsSet(THEME_KEY, next);
  applyTheme(next);
}
(function initTheme() {
  var saved = lsGet(THEME_KEY);
  applyTheme(saved === 'light' ? 'light' : 'dark');
})();

/* ===== Auth (cloud) ===== */
function switchAuth(mode) {
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabReg').classList.toggle('active', mode === 'reg');
  document.getElementById('authSubmit').textContent = mode === 'login' ? '登录' : '创建账号';
  hideAuthError();
}
function showAuthError(msg) {
  var el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.add('show');
}
function hideAuthError() { document.getElementById('authError').classList.remove('show'); }

async function handleAuth(e) {
  e.preventDefault();
  var user = document.getElementById('authUser').value.trim();
  var pass = document.getElementById('authPass').value;
  if (!/^[a-zA-Z0-9_\u4e00-\u9fa5-]{2,20}$/.test(user)) { showAuthError('用户名需 2-20 个字符（字母、数字、下划线、中文）'); return false; }
  if (pass.length < 4) { showAuthError('密码至少 4 位'); return false; }

  var btn = document.getElementById('authSubmit');
  btn.disabled = true; btn.textContent = '请稍候…';
  hideAuthError();

  try {
    var endpoint = authMode === 'reg' ? '/register' : '/login';
    var res = await fetch(API_BASE + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    var data = {};
    try { data = await res.json(); } catch (err) {}

    if (!res.ok) {
      // v1.1.0 本地账号无缝迁移：云端无此用户，但本地有且密码匹配 → 自动注册到云端
      if (res.status === 404 && authMode === 'login') {
        var localUser = (lsGet(LOCAL_USERS_KEY) || {})[user.toLowerCase()];
        if (localUser) {
          var localHash = await sha256Hex(localUser.salt + pass);
          if (localHash === localUser.hash) {
            var r2 = await fetch(API_BASE + '/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: user, password: pass })
            });
            var d2 = {};
            try { d2 = await r2.json(); } catch (err) {}
            if (r2.ok && d2.token) { await afterAuth(d2.token, d2.username); return false; }
            showAuthError('本地账号迁移到云端失败：' + ((d2 && d2.error) || '请稍后重试'));
            return false;
          }
        }
      }
      showAuthError(data.error || '请求失败，请重试');
      return false;
    }
    await afterAuth(data.token, data.username);
  } catch (err) {
    showAuthError('网络错误，请检查网络后重试');
  } finally {
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? '登录' : '创建账号';
  }
  return false;
}

/* 登录/注册成功后：拉取云端数据 + 合并本地缓存（同一天时间戳新者胜）+ 上传本地新增 */
async function afterAuth(token, username) {
  currentUser = { id: username.toLowerCase(), name: username, token: token };
  lsSet(SESSION_KEY, { user: currentUser.id, token: token, ts: Date.now() });

  // 1. 收集本地数据：离线缓存 + v1.0 匿名数据
  var local = lsGet(dataKey(currentUser.id)) || {};
  var legacy = lsGet(LEGACY_KEY);
  if (legacy && Object.keys(legacy).length) {
    Object.keys(legacy).forEach(function(k) {
      if (!local[k] || ((legacy[k].ts || 0) > (local[k].ts || 0))) local[k] = legacy[k];
    });
    lsSet(LEGACY_BACKUP_KEY, legacy);
    localStorage.removeItem(LEGACY_KEY);
  }

  // 2. 拉取云端
  var cloud = {};
  try {
    var res = await authFetch('/records');
    if (res.status === 401) {
      currentUser = null;
      localStorage.removeItem(SESSION_KEY);
      showAuthError('会话已过期，请重新登录');
      return;
    }
    if (res.ok) cloud = ((await res.json()).records) || {};
  } catch (err) { /* 离线：仅用本地缓存 */ }

  // 3. 逐天合并，时间戳新者胜；本地较新/云端缺失的记录待上传
  var merged = {}, toUpload = {};
  var allDates = {};
  Object.keys(cloud).concat(Object.keys(local)).forEach(function(d) { allDates[d] = 1; });
  Object.keys(allDates).forEach(function(d) {
    var c = cloud[d], l = local[d];
    if (!c && l) { merged[d] = l; toUpload[d] = l; }
    else if (!l && c) { merged[d] = c; }
    else if ((l.ts || 0) >= (c.ts || 0)) { merged[d] = l; toUpload[d] = l; }
    else { merged[d] = c; }
  });

  // 4. 上传本地新增/较新记录
  if (Object.keys(toUpload).length) {
    try { await authFetch('/records/batch', { method: 'POST', body: JSON.stringify({ records: toUpload }) }); } catch (err) {}
  }

  // 5. 清理未来日期的脏数据（正常打卡不可能产生未来日期；且未来格子不可点击无法手动删除）
  var t = new Date();
  var todayStr = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
  Object.keys(merged).forEach(function(d) {
    if (d > todayStr) {
      delete merged[d];
      authFetch('/records/' + d, { method: 'DELETE' }).catch(function() {});
    }
  });

  records = merged;
  lsSet(dataKey(currentUser.id), merged);   // 更新离线缓存

  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('userAvatar').textContent = currentUser.name.charAt(0);
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  renderAll();
}

function logout() {
  if (!confirm('退出登录？（数据已同步到云端）')) return;
  var token = currentUser && currentUser.token;
  currentUser = null;
  localStorage.removeItem(SESSION_KEY);
  if (token) {
    fetch(API_BASE + '/logout', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } }).catch(function() {});
  }
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('authPass').value = '';
  switchAuth('login');
}

/* 本地缓存保存（云端同步失败时兜底，下次登录自动补传） */
function saveRecords() { if (currentUser) lsSet(dataKey(currentUser.id), records); }

/* ===== Session restore (verify token with server) ===== */
(async function restoreSession() {
  var session = lsGet(SESSION_KEY);
  if (!session || !session.token) return;
  try {
    var res = await fetch(API_BASE + '/me', { headers: { 'Authorization': 'Bearer ' + session.token } });
    if (res.ok) {
      var data = await res.json();
      await afterAuth(session.token, data.username);
    } else {
      localStorage.removeItem(SESSION_KEY);
    }
  } catch (err) {
    localStorage.removeItem(SESSION_KEY);
  }
})();

/* ===== Calendar & stats (unchanged logic) ===== */
function isToday(y, m, d) { var t = new Date(); return y === t.getFullYear() && m === t.getMonth() && d === t.getDate(); }
function isFuture(y, m, d) { var t = new Date(); t.setHours(0,0,0,0); return new Date(y, m, d) > t; }
function getDayStatus(rec) {
  if (!rec) return null;
  var appOk = rec.app === 'yes', webOk = rec.web === 'yes';
  if (appOk && webOk) return 'full';
  if (appOk || webOk) return 'partial';
  return 'none';
}

function renderToday() {
  var t = new Date();
  document.getElementById('todayPill').textContent =
    t.getFullYear() + '年' + (t.getMonth()+1) + '月' + t.getDate() + '日 · 周' + WEEKDAYS[t.getDay()];
}

function renderCalendars() {
  var container = document.getElementById('calendars');
  container.innerHTML = '';
  for (var offset = 0; offset >= -1; offset--) {
    var d = new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1);
    container.appendChild(renderMonth(d.getFullYear(), d.getMonth()));
  }
}

function renderMonth(year, month) {
  var section = document.createElement('div');
  section.className = 'month-section';
  var count = 0;
  Object.keys(records).forEach(function(k) {
    var p = k.split('-').map(Number);
    if (p[0] === year && (p[1]-1) === month) count++;
  });
  var title = document.createElement('div');
  title.className = 'month-title';
  title.innerHTML = year + '年 ' + MONTH_NAMES[month] + ' <span class="badge">' + count + ' 天已打卡</span>';
  section.appendChild(title);

  var cal = document.createElement('div');
  cal.className = 'calendar';
  WEEKDAYS.forEach(function(wd) {
    var h = document.createElement('div');
    h.className = 'cal-header';
    h.textContent = wd;
    cal.appendChild(h);
  });
  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  for (var i = 0; i < firstDay; i++) {
    var e = document.createElement('div');
    e.className = 'day-cell empty';
    cal.appendChild(e);
  }
  for (var day = 1; day <= daysInMonth; day++) {
    var cell = document.createElement('div');
    cell.className = 'day-cell';
    var key = dateKey(year, month, day);
    var rec = records[key];
    var status = getDayStatus(rec);
    if (isToday(year, month, day)) cell.classList.add('today');
    if (isFuture(year, month, day)) cell.classList.add('future');
    if (status) cell.classList.add(status);
    var numDiv = document.createElement('div');
    numDiv.className = 'day-num';
    numDiv.textContent = day;
    cell.appendChild(numDiv);
    if (rec && rec.env) {
      var envDiv = document.createElement('div');
      envDiv.className = 'day-env';
      envDiv.textContent = ENV_CODES[rec.env] || rec.env;
      cell.appendChild(envDiv);
    }
    if (!isFuture(year, month, day)) {
      (function(k, y, m, d) {
        cell.addEventListener('click', function() { openModal(k, y, m, d); });
      })(key, year, month, day);
    }
    cal.appendChild(cell);
  }
  section.appendChild(cal);
  return section;
}

function openModal(key, y, m, d) {
  modalState.dateKey = key;
  var rec = records[key] || {};
  modalState.app = rec.app || null;
  modalState.web = rec.web || null;
  modalState.env = rec.env || null;
  document.getElementById('modalTitle').textContent = '打卡';
  document.getElementById('modalDate').textContent = formatDateCN(y, m, d);
  updateToggleGroup('appGroup', modalState.app);
  updateToggleGroup('webGroup', modalState.web);
  updateEnvGroup(modalState.env);
  document.getElementById('btnDelete').style.display = rec.app ? 'block' : 'none';
  document.getElementById('modalOverlay').classList.add('active');
}

function updateToggleGroup(groupId, val) {
  document.querySelectorAll('#' + groupId + ' .btn-toggle').forEach(function(btn) {
    btn.classList.remove('selected', 'yes', 'no');
    if (btn.dataset.val === val) btn.classList.add('selected', val);
  });
}
function updateEnvGroup(val) {
  document.querySelectorAll('#envGroup .btn-toggle').forEach(function(btn) {
    btn.classList.remove('selected');
    if (btn.dataset.val === val) btn.classList.add('selected');
  });
}

document.querySelectorAll('#appGroup .btn-toggle').forEach(function(btn) {
  btn.addEventListener('click', function() { modalState.app = btn.dataset.val; updateToggleGroup('appGroup', modalState.app); });
});
document.querySelectorAll('#webGroup .btn-toggle').forEach(function(btn) {
  btn.addEventListener('click', function() { modalState.web = btn.dataset.val; updateToggleGroup('webGroup', modalState.web); });
});
document.querySelectorAll('#envGroup .btn-toggle').forEach(function(btn) {
  btn.addEventListener('click', function() { modalState.env = btn.dataset.val; updateEnvGroup(modalState.env); });
});

document.getElementById('btnCancel').addEventListener('click', closeModal);
document.getElementById('btnSave').addEventListener('click', function() {
  if (!modalState.app || !modalState.web || !modalState.env) { alert('请完成所有选项后再保存'); return; }
  var rec = { app: modalState.app, web: modalState.web, env: modalState.env, ts: Date.now() };
  records[modalState.dateKey] = rec;
  saveRecords();                                  // 本地缓存（同步失败兜底）
  authFetch('/records', { method: 'PUT', body: JSON.stringify(rec) }).catch(function() {});
  closeModal(); renderAll();
});
document.getElementById('btnDelete').addEventListener('click', function() {
  if (confirm('确定删除这条打卡记录？')) {
    var key = modalState.dateKey;
    delete records[key];
    saveRecords();
    authFetch('/records/' + key, { method: 'DELETE' }).catch(function() {});
    closeModal(); renderAll();
  }
});
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

function renderStats() {
  var entries = Object.entries(records).sort(function(a, b) { return b[0].localeCompare(a[0]); });
  var total = entries.length;
  var bothOk = 0, partial = 0, noneOk = 0, appOkCount = 0, webOkCount = 0;
  var envStats = {};
  entries.forEach(function(entry) {
    var rec = entry[1];
    var status = getDayStatus(rec);
    if (status === 'full') bothOk++; else if (status === 'partial') partial++; else noneOk++;
    if (rec.app === 'yes') appOkCount++;
    if (rec.web === 'yes') webOkCount++;
    if (rec.env) {
      if (!envStats[rec.env]) envStats[rec.env] = { total: 0, full: 0, partial: 0, none: 0 };
      envStats[rec.env].total++;
      envStats[rec.env][status]++;
    }
  });

  document.getElementById('statsGrid').innerHTML =
    '<div class="stat-card"><div class="num" style="color:var(--green)">' + bothOk + '</div><div class="label">两个都可用</div></div>' +
    '<div class="stat-card"><div class="num" style="color:var(--orange)">' + partial + '</div><div class="label">部分可用</div></div>' +
    '<div class="stat-card"><div class="num" style="color:var(--red)">' + noneOk + '</div><div class="label">都不可用</div></div>' +
    '<div class="stat-card"><div class="num">' + total + '</div><div class="label">总打卡天数</div></div>' +
    '<div class="stat-card"><div class="num" style="color:var(--blue)">' + appOkCount + '</div><div class="label">App 可用天数</div></div>' +
    '<div class="stat-card"><div class="num" style="color:var(--blue)">' + webOkCount + '</div><div class="label">网页版可用天数</div></div>';

  var envHTML = '<h3>按使用环境分布</h3>';
  var envValues = Object.values(envStats).map(function(e) { return e.total; });
  var maxEnv = envValues.length ? Math.max.apply(null, envValues) : 1;
  Object.entries(envStats).sort(function(a, b) { return b[1].total - a[1].total; }).forEach(function(entry) {
    var env = entry[0], stats = entry[1];
    var pct = (stats.total / maxEnv * 100).toFixed(0);
    envHTML += '<div class="env-row"><div class="env-label"><span class="env-flag">' + (ENV_CODES[env] || '') + '</span>' + env + '</div>' +
      '<div class="env-bars">' +
      '<span class="env-mini" style="color:var(--green)">' + stats.full + ' OK</span>' +
      '<span class="env-mini" style="color:var(--orange)">' + stats.partial + ' ~</span>' +
      '<span class="env-mini" style="color:var(--red)">' + stats.none + ' X</span>' +
      '<div class="env-bar-track"><div class="env-bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="env-bar-num">' + stats.total + '</div></div></div>';
  });
  document.getElementById('envBreakdown').innerHTML = envHTML;

  var recentHTML = '<h3>最近打卡记录</h3>';
  var recent = entries.slice(0, 10);
  if (recent.length === 0) {
    recentHTML += '<div style="color:var(--fg-muted);font-size:13px;padding:8px 0;">暂无记录，点击上方日历开始打卡</div>';
  } else {
    recent.forEach(function(entry) {
      var k = entry[0], rec = entry[1];
      var parts = k.split('-').map(Number);
      var weekday = WEEKDAYS[new Date(parts[0], parts[1]-1, parts[2]).getDay()];
      recentHTML += '<div class="entry-row"><div class="entry-date">' + parts[1] + '月' + parts[2] + '日 周' + weekday + '</div>' +
        '<div class="entry-status">' +
        '<span class="status-tag ' + (rec.app === 'yes' ? 'ok' : 'no') + '">App ' + (rec.app === 'yes' ? 'OK' : 'NO') + '</span>' +
        '<span class="status-tag ' + (rec.web === 'yes' ? 'ok' : 'no') + '">Web ' + (rec.web === 'yes' ? 'OK' : 'NO') + '</span>' +
        '</div><div class="entry-env">' + (ENV_CODES[rec.env] || '') + ' · ' + (rec.env || '') + '</div></div>';
    });
  }
  document.getElementById('recentEntries').innerHTML = recentHTML;
}

function renderAll() { renderToday(); renderCalendars(); renderStats(); }

/* ===== Version tag ===== */
document.getElementById('versionTag').textContent = 'v' + APP_VERSION;
document.title = 'Copilot × Outlook 可用性打卡 v' + APP_VERSION;
</script>
</body>
</html>
